trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

schedules:
  - cron: "0 2 * * *"
    displayName: "Nightly regression run"
    branches:
      include:
        - main
    always: true

variables:
  - group: browserstack-credentials

stages:

  # ============================================================
  # SMOKE — runs on every PR into main
  # ============================================================
  - stage: Smoke
    condition: eq(variables['Build.Reason'], 'PullRequest')
    displayName: "Smoke Suite (PR)"
    jobs:
      - job: AndroidSmoke
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - script: npm ci
            displayName: 'Install dependencies'
          - script: npm run android:bstack:smoke
            displayName: 'Run Android Smoke Suite on BrowserStack'
            env:
              BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
              BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'reports/junit-results/*.xml'
              testRunTitle: 'Android Smoke'
          - script: npm run report:generate
            condition: succeededOrFailed()
            displayName: 'Generate Allure report'
          - task: PublishBuildArtifacts@1
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: 'reports/allure-report'
              ArtifactName: 'allure-report-android-smoke'

      - job: iOSSmoke
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - script: npm ci
            displayName: 'Install dependencies'
          - script: npm run ios:bstack:smoke
            displayName: 'Run iOS Smoke Suite on BrowserStack'
            env:
              BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
              BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'reports/junit-results/*.xml'
              testRunTitle: 'iOS Smoke'
          - script: npm run report:generate
            condition: succeededOrFailed()
            displayName: 'Generate Allure report'
          - task: PublishBuildArtifacts@1
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: 'reports/allure-report'
              ArtifactName: 'allure-report-ios-smoke'

  # ============================================================
  # SANITY — runs on merge to main (not PR, not scheduled)
  # ============================================================
  - stage: Sanity
    condition: >
      and(
        eq(variables['Build.Reason'], 'IndividualCI'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    displayName: "Sanity Suite (main branch)"
    jobs:
      - job: AndroidSanity
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - script: npm ci
          - script: npm run android:bstack:sanity
            env:
              BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
              BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'reports/junit-results/*.xml'
              testRunTitle: 'Android Sanity'
          - script: npm run report:generate
            condition: succeededOrFailed()
          - task: PublishBuildArtifacts@1
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: 'reports/allure-report'
              ArtifactName: 'allure-report-android-sanity'

      - job: iOSSanity
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - script: npm ci
          - script: npm run ios:bstack:sanity
            env:
              BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
              BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'reports/junit-results/*.xml'
              testRunTitle: 'iOS Sanity'
          - script: npm run report:generate
            condition: succeededOrFailed()
          - task: PublishBuildArtifacts@1
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: 'reports/allure-report'
              ArtifactName: 'allure-report-ios-sanity'

  # ============================================================
  # REGRESSION — nightly scheduled run, full parallel device matrix
  # ============================================================
  - stage: Regression
    condition: eq(variables['Build.Reason'], 'Schedule')
    displayName: "Regression Suite (nightly)"
    jobs:
      - job: AndroidRegression
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - script: npm ci
          - script: npm run android:bstack:regression
            env:
              BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
              BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'reports/junit-results/*.xml'
              testRunTitle: 'Android Regression'
          - script: npm run report:generate
            condition: succeededOrFailed()
          - task: PublishBuildArtifacts@1
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: 'reports/allure-report'
              ArtifactName: 'allure-report-android-regression'

      - job: iOSRegression
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - script: npm ci
          - script: npm run ios:bstack:regression
            env:
              BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
              BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'reports/junit-results/*.xml'
              testRunTitle: 'iOS Regression'
          - script: npm run report:generate
            condition: succeededOrFailed()
          - task: PublishBuildArtifacts@1
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: 'reports/allure-report'
              ArtifactName: 'allure-report-ios-regression'